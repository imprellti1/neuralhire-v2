<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Landing NeuralHire - Capturas</title>
  <style>
    body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#07111f;color:#fff}
    .wrap{max-width:1440px;margin:0 auto;padding:32px}
    h1{margin:0 0 8px;font-size:28px}
    p{margin:0 0 24px;color:#b7c7e6}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
    figure{margin:0;background:#0c162a;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:12px;box-shadow:0 24px 60px rgba(0,0,0,.28)}
    img{width:100%;height:auto;display:block;border-radius:12px;background:#0a1220}
    figcaption{margin-top:10px;font-size:14px;color:#d8e5fb;display:flex;justify-content:space-between;gap:8px;align-items:center}
    .tag{padding:4px 10px;border-radius:999px;background:linear-gradient(135deg,#8b5cf6,#22c3ff);color:#fff;font-size:12px;font-weight:700}
    @media (max-width: 1100px){.grid{grid-template-columns:1fr}.wrap{padding:20px}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Capturas da landing NeuralHire</h1>
    <p>Visualização local das três resoluções solicitadas: desktop 1366x768, tablet 1024x768 e mobile 390x844.</p>
    <div class="grid">
      <figure>
        <img src="/landing-shots/landing-1366x768.png" alt="Landing NeuralHire 1366x768">
        <figcaption><span>Desktop</span><span class="tag">1366×768</span></figcaption>
      </figure>
      <figure>
        <img src="/landing-shots/landing-1024x768.png" alt="Landing NeuralHire 1024x768">
        <figcaption><span>Tablet</span><span class="tag">1024×768</span></figcaption>
      </figure>
      <figure>
        <img src="/landing-shots/landing-390x844.png" alt="Landing NeuralHire 390x844">
        <figcaption><span>Mobile</span><span class="tag">390×844</span></figcaption>
      </figure>
    </div>
  </div>
</body>
</html>
