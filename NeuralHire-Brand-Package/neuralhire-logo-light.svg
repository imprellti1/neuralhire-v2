<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="NeuralHire">
  <defs>
    <linearGradient id="nhGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="48%" stop-color="#4F8CFF"/>
      <stop offset="100%" stop-color="#22C3FF"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="#FFFFFF"/>

  <g id="mark" transform="translate(95 95)" fill="none" stroke="url(#nhGradient)" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <!-- speed trails -->
    <path d="M6 101 H112" stroke-width="8" opacity=".42"/>
    <path d="M0 162 H142" stroke-width="8" opacity=".58"/>
    <path d="M18 225 H124" stroke-width="8" opacity=".42"/>

    <!-- brain outline -->
    <path d="M195 26
      C151 25 124 47 114 78
      C77 79 54 104 54 136
      C26 145 11 170 15 199
      C19 230 43 248 71 250
      C80 287 112 310 151 304
      C165 329 193 344 222 337
      C247 331 261 312 261 287
      L261 64
      C248 41 224 28 195 26 Z" stroke-width="13"/>

    <path d="M261 64
      C275 39 302 25 334 27
      C377 29 405 54 413 91
      C448 96 471 124 469 159
      C501 171 516 202 505 236
      C493 273 459 291 424 283
      C405 318 370 332 332 318
      C313 341 279 342 261 320
      Z" stroke-width="13"/>

    <!-- center division -->
    <path d="M261 62 V323" stroke-width="12" opacity=".95"/>

    <!-- left neural paths -->
    <path d="M52 101 H140 L181 62 H214" stroke-width="7"/>
    <path d="M15 162 H117 L162 162 L207 121" stroke-width="7"/>
    <path d="M40 225 H139 L179 264 H222" stroke-width="7"/>
    <path d="M119 136 L174 91" stroke-width="6" opacity=".92"/>
    <path d="M137 201 L201 201 L228 228" stroke-width="6" opacity=".92"/>
    <path d="M181 62 V103" stroke-width="6" opacity=".82"/>
    <path d="M207 121 H238" stroke-width="6" opacity=".82"/>

    <!-- right neural paths -->
    <path d="M305 62 V118 L342 154 H401" stroke-width="7"/>
    <path d="M306 250 V192 L352 192 L389 151" stroke-width="7"/>
    <path d="M300 304 V268 L351 225 H433" stroke-width="7"/>
    <path d="M358 83 H405 L430 112" stroke-width="6" opacity=".92"/>
    <path d="M390 241 V275" stroke-width="6" opacity=".82"/>
    <path d="M345 154 V191" stroke-width="6" opacity=".82"/>

    <!-- nodes -->
    <g fill="#FFFFFF" stroke="url(#nhGradient)" stroke-width="7">
      <circle cx="52" cy="101" r="12"/>
      <circle cx="15" cy="162" r="12"/>
      <circle cx="40" cy="225" r="12"/>
      <circle cx="214" cy="62" r="11"/>
      <circle cx="207" cy="121" r="12"/>
      <circle cx="222" cy="264" r="12"/>
      <circle cx="238" cy="121" r="8"/>
      <circle cx="305" cy="62" r="12"/>
      <circle cx="401" cy="154" r="12"/>
      <circle cx="433" cy="225" r="12"/>
      <circle cx="390" cy="241" r="10"/>
      <circle cx="430" cy="112" r="10"/>
      <circle cx="300" cy="304" r="12"/>
    </g>
  </g>

  <g id="wordmark" transform="translate(650 218)">
    <text x="0" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="124" font-weight="760" letter-spacing="-5" fill="#0B1020">Neural</text>
    <text x="405" y="0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="124" font-weight="760" letter-spacing="-5" fill="url(#nhGradient)">Hire</text>
    <text x="4" y="82" font-family="Inter, Arial, Helvetica, sans-serif" font-size="33" font-weight="500" letter-spacing="12" fill="#475569">INTELIGÊNCIA QUE VENDE POR VOCÊ</text>
  </g>
</svg>